name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uvx ruff@0.12.12 format --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uvx ruff@0.12.12 check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: >-
          uvx --from mypy==1.15.0 mypy --ignore-missing-imports
          --follow-imports=skip packages/sdk/src packages/api/src

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/sdk/src:${{ github.workspace }}/packages/api/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: >-
          uv run --isolated --no-project --with pytest==8.3.5
          --with 'httpx>=0.28.1' python -m pytest -q
          packages/sdk/tests/test_memory_context.py
          packages/api/tests/test_gen_report_engine.py
          packages/api/tests/test_language_prefix.py
